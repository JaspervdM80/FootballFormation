# Fly.io configuration — deploy with `fly deploy` from the repo root.
app = "gjs-meiden"
primary_region = "ams"
swap_size_mb = 512

[[mounts]]
  source = "data"
  destination = "/data"
  # Fly snapshots this volume daily and keeps them off-volume, which is the half of the backup
  # story /data cannot tell: the pre-migration copies in /data/backups live on the disk they
  # protect, so a lost volume takes the database and every snapshot of it together. Declared here
  # rather than left to the 5-day default so the retention is in version control, and long enough
  # that a season's data survives a problem nobody noticed over a school holiday. Max is 60.
  snapshot_retention = 30

[http_service]
  internal_port = 8080
  force_https = true
  # min_machines_running = 1 pins the one machine this app runs, so auto_stop_machines never fires:
  # it governs machines *above* the minimum. Kept at "suspend" because it is the value that has to
  # be right the moment that stops being true — drop the minimum back to 0, or run a second
  # machine, and "stop" would cold-boot (a pre-migration backup, a migration and an integrity check
  # before it serves anything) and lose every circuit held for `DisconnectedCircuitRetentionPeriod`,
  # which lives in memory and nowhere else. See docs/known_issues/touch-pwa.md, "past the retention
  # period there is no reconnect at all". Suspend needs RAM <= 2G; this VM is 512mb.
  #
  # KeepAlivePingService now pings a machine that cannot stop — dead weight, not a safeguard.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
