# Fly.io configuration — deploy with `fly deploy` from the repo root.
app = "gjs-meiden"
primary_region = "ams"
swap_size_mb = 512

[[mounts]]
  source = "data"
  destination = "/data"
  # Fly snapshots this volume daily and keeps them off-volume, which is the half of the backup
  # story /data cannot tell: the pre-migration copies in /data/backups live on the disk they
  # protect, so a lost volume takes the database and every snapshot of it together. Declared here
  # rather than left to the 5-day default so the retention is in version control, and long enough
  # that a season's data survives a problem nobody noticed over a school holiday. Max is 60.
  snapshot_retention = 30

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle: the machine stops when nobody is connected and
  # cold-starts in a few seconds on the next request. Keeps the bill near zero.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
