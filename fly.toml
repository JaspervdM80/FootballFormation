# Fly.io configuration — deploy with `fly deploy` from the repo root.
app = "gjs-meiden"
primary_region = "ams"
swap_size_mb = 512

[[mounts]]
  source = "data"
  destination = "/data"
  # Fly snapshots this volume daily and keeps them off-volume, which is the half of the backup
  # story /data cannot tell: the pre-migration copies in /data/backups live on the disk they
  # protect, so a lost volume takes the database and every snapshot of it together. Declared here
  # rather than left to the 5-day default so the retention is in version control, and long enough
  # that a season's data survives a problem nobody noticed over a school holiday. Max is 60.
  snapshot_retention = 30

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle, so the bill stays near zero. "suspend" rather than "stop": suspend
  # saves the machine's memory to disk and resumes from it, where stop cold-boots — and this app's
  # boot is not cheap, since it takes a pre-migration backup, migrates and runs an integrity check
  # before it serves anything.
  #
  # Resuming from memory is also the only way a phone gets its circuit back. Circuits held for
  # `DisconnectedCircuitRetentionPeriod` (ten minutes, see Program.cs) live in memory and nowhere
  # else, so a stopped machine loses every one of them and a returning phone is always a rejected
  # reconnect and a forced reload — see docs/known_issues.md, "past the retention period there is
  # no reconnect at all". A resumed machine still has them, so the rejoin can actually happen.
  #
  # The idle period before this fires is roughly five minutes and Fly does not expose it, so it
  # cannot be lengthened directly — see KeepAlivePingService (src/FootballFormation.Web/KeepAlive/)
  # for how the app instead keeps itself pinged for up to 30 minutes after the last real visitor.
  # Suspend needs RAM <= 2G — this VM is 512mb — and leaves the mounted volume untouched.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
