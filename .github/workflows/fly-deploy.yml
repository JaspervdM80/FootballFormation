name: Deploy to Fly.io

on:
  push:
    branches: [main]
  # Also on PRs into main: the build job is the gate that keeps a broken migration off the Fly
  # volume, and running it only after the merge means finding out on the way to production. The
  # deploy job below is guarded by an `if` so a pull request builds and tests but never deploys.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # Gate: nothing reaches the Fly volume that doesn't compile and pass its tests. The app
  # auto-migrates on startup, so a broken build is a broken production database.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    needs: build
    # Never from a pull request — a fork's PR must not be able to reach the deploy token.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the 1.6 tag's commit so upstream changes can't run unreviewed with our token
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # --ha=false: single machine only — SQLite lives on one volume (see docs/deployment.md)
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
