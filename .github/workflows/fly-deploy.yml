name: Deploy to Fly.io

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. The build job is the gate that keeps a broken
  # migration off the Fly volume; the deploy job below is guarded by an `if`, so a pull request
  # builds and tests but never deploys.
  pull_request:
  workflow_dispatch:

# Keyed by ref, so a pull request's checks start straight away instead of queueing behind a
# deploy. Only deploys need serialising, and that now lives on the deploy job itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a run on main is cancelling a deploy halfway through, so only PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Gate: nothing reaches the Fly volume that doesn't compile and pass its tests. The app
  # auto-migrates on startup, so a broken build is a broken production database.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    needs: build
    # Never from a pull request — a fork's PR must not be able to reach the deploy token. And only
    # ever from main: `workflow_dispatch` runs against any branch, and without the ref check would
    # put that branch on the production volume.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time: SQLite lives on a single volume and the app migrates on boot, so two
    # overlapping deploys race over one machine.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # Pinned to the 1.6 tag's commit so upstream changes can't run unreviewed with our token
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # --ha=false: single machine only — SQLite lives on one volume (see docs/deployment.md)
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
