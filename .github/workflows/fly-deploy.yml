name: Deploy to Fly.io

# Only ever main. Pull requests are built by ci.yml, which has no deploy job at all — the two are
# separate files so a pull request's checks cannot include anything called "deploy".
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: SQLite lives on a single volume and the app migrates on boot, so two
# overlapping deploys race over one machine.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: nothing reaches the Fly volume that doesn't compile and pass its tests. The app
  # auto-migrates on startup, so a broken build is a broken production database.
  build:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: build
    # `workflow_dispatch` runs against any branch, and without the ref check would put that branch
    # on the production volume. The actor check is about *who*: a dispatch can be started by anyone
    # with write access, and while the environment's reviewer below would stop it anyway, refusing
    # it here keeps a run that was never going to deploy out of the approval queue.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    # The gate that decides *whether* a release goes out, and the only place the Fly token exists.
    # `production` carries a required reviewer, so this job holds at "Waiting" until a human
    # approves it — merging to main proposes a deploy rather than performing one. It also carries a
    # deployment branch policy of `main` only, which is what stops a workflow added on a feature
    # branch from reading FLY_API_TOKEN at all: an environment secret is unreachable from a ref the
    # environment does not admit. See docs/deployment.md — none of it lives in this file, and the
    # environment has to exist before this workflow runs.
    environment:
      name: production
      url: https://gjs-meiden.nl
    steps:
      - uses: actions/checkout@v7
      # Pinned to the 1.6 tag's commit so upstream changes can't run unreviewed with our token
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # --ha=false: single machine only — SQLite lives on one volume (see docs/deployment.md)
      # --build-arg GIT_SHA: baked into the image and reported by /health, so the smoke check below
      # can tell this release apart from whatever was serving before it.
      - run: flyctl deploy --remote-only --ha=false --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A green deploy only means the machine started. This is the step that says it *serves*:
      # /health opens the database, so a boot that migrated badly, or refused to migrate at all,
      # fails here instead of on the first parent to open the app on match day.
      #
      # Deliberately a one-shot request rather than a `[[http_service.checks]]` block in fly.toml:
      # Fly's proxy checks count towards the concurrency its autostop decision reads, so a check
      # every few seconds would hold the machine awake and undo scale-to-zero.
      # A 200 alone would only prove *a* container is up. Comparing the commit /health reports
      # against the one this run built is what proves the new release is the one serving — Fly can
      # report a successful deploy while the previous machine carries on answering, and the site
      # looks perfectly healthy in that state because it is; it is just the old site.
      - name: Smoke check
        run: |
          for attempt in 1 2 3 4 5; do
            # The public hostname, not gjs-meiden.fly.dev — this way DNS and the certificate are
            # part of what gets checked, since they are what a visitor actually resolves.
            # `|| code=000` so a connection failure is a failed attempt, not a dead step: curl
            # exits non-zero there, and this script runs under `set -e`.
            code=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 30 https://gjs-meiden.nl/health) || code=000
            if [ "$code" = "200" ]; then
              # `|| served=` so malformed JSON is a failed attempt rather than a dead step.
              served=$(jq -r '.version' /tmp/health) || served=
              if [ "$served" = "$GITHUB_SHA" ]; then
                echo "Serving $served"
                cat /tmp/health
                exit 0
              fi
              # Healthy, but still the previous release — it is probably mid-swap, so this is a
              # retry rather than a failure until the attempts run out.
              echo "Attempt $attempt: healthy but serving $served, waiting for $GITHUB_SHA"
            else
              echo "Attempt $attempt: HTTP $code"
            fi
            # The machine is usually cold-starting from zero, so back off rather than fail on the
            # first miss — 5s, 10s, 15s, 20s. No pause after the last one; nothing follows it.
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 5)); fi
          done
          echo "::error::/health never confirmed $GITHUB_SHA is serving — the release deployed but is not live."
          if [ -s /tmp/health ]; then cat /tmp/health; fi
          exit 1
