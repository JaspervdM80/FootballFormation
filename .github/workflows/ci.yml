name: CI

on:
  # Every pull request, whatever it targets. Kept for pull requests from a fork, which the push
  # trigger below never sees.
  pull_request:
  # And every push to a branch, because GitHub starts no workflow run for an event it attributes to
  # an app token — so a pull request opened by one sits with no "Build and test" at all, and the
  # merge button stays disabled until somebody pushes again. A push always belongs to whoever
  # pushed. main is excluded: fly-deploy.yml calls this workflow there.
  #
  # The cost is that a pull request from this repository builds twice, once per event — about a
  # minute of runner time, and free, since Actions minutes on a public repository are.
  #
  # The two runs are not testing the same thing, which is the part worth knowing. `actions/checkout`
  # resolves a `pull_request` event to `refs/pull/N/merge` — this branch already merged into main —
  # while the push event checks out the branch tip as it stands. Since
  # `strict_required_status_checks_policy` is deliberately off (see docs/deployment.md), a branch
  # can merge without ever being rebuilt against a moved main, and the pull_request run is the only
  # one testing that combination. Both report as "Build and test", so either satisfies the ruleset.
  push:
    branches-ignore: [main]
  # Called by fly-deploy.yml, so the gate in front of a deploy is literally the same build and
  # test a pull request ran, rather than a copy of it that can drift.
  workflow_call:
  workflow_dispatch:

# Keyed by ref, so a pull request's checks start straight away instead of queueing behind a
# deploy. A run on main is left to finish — its build is what a deploy is waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Nothing here can deploy: this workflow holds no deploy job and no Fly token. That is the point
  # of it being separate — a pull request cannot reach production by way of a misread condition.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The SDK comes from global.json, not from a floating '10.0.x' — that resolved to a different
      # *feature band* than the one a Claude Code web container installs (10.0.302 against 10.0.110),
      # and an RZ2005 Razor error once failed there while this build stayed green. global.json sets
      # rollForward: disable, so a runner that happens to preinstall a newer 10.x cannot be picked
      # up instead of the version installed here.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Keyed on what decides the graph — the central package versions, the project files, and the
      # SDK pin — so a run that changes none of them restores from disk instead of from nuget.org.
      # `restore-keys` means a run that *does* change one still starts from the last good cache and
      # fetches only what moved.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal
