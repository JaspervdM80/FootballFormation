name: CI

on:
  # Every pull request, whatever it targets, and nothing else — this is the only event that builds
  # what merging would actually produce. `actions/checkout` resolves a `pull_request` event to
  # `refs/pull/N/merge`, the branch already merged into main, where a push event checks out the
  # branch tip on its own. Since `strict_required_status_checks_policy` is deliberately off (see
  # docs/deployment.md), a branch can merge without being rebuilt against a moved main, so the
  # merge ref is the one worth testing. It also covers a fork's pull request, which push never sees.
  #
  # This carried a `push: branches-ignore: [main]` trigger too, which meant every pull request from
  # this repository built twice. That existed because GitHub starts no workflow run for an event it
  # attributes to an app token, so a pull request opened by one sat with no "Build and test" and the
  # merge button stayed disabled. That is no longer what happens: the run history shows
  # `pull_request` runs appearing at open time on commits pushed hours earlier, with no push in
  # between, on pull requests opened exactly that way.
  #
  # If it ever regresses, the symptom is a pull request whose checks never appear — not a red one.
  # `workflow_dispatch` below is the escape hatch, and one more commit on the branch also does it.
  pull_request:
  # Called by fly-deploy.yml, so the gate in front of a deploy is literally the same build and
  # test a pull request ran, rather than a copy of it that can drift.
  workflow_call:
  workflow_dispatch:

# Keyed by ref, so a pull request's checks start straight away instead of queueing behind a
# deploy. A run on main is left to finish — its build is what a deploy is waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Nothing here can deploy: this workflow holds no deploy job and no Fly token. That is the point
  # of it being separate — a pull request cannot reach production by way of a misread condition.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The SDK comes from global.json, not from a floating '10.0.x' — that resolved to a different
      # *feature band* than the one a Claude Code web container installs (10.0.302 against 10.0.110),
      # and an RZ2005 Razor error once failed there while this build stayed green. global.json sets
      # rollForward: disable, so a runner that happens to preinstall a newer 10.x cannot be picked
      # up instead of the version installed here.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Keyed on what decides the graph — the central package versions, the project files, and the
      # SDK pin — so a run that changes none of them restores from disk instead of from nuget.org.
      # `restore-keys` means a run that *does* change one still starts from the last good cache and
      # fetches only what moved.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal
