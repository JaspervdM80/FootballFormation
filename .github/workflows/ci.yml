name: CI

# The whole pipeline for a change, in one file and in one shape: build it, test it, publish it,
# then drive a browser over the thing that was published and judge what the tests covered. The
# coverage report comes out of the gate's own test run, so the number is about the code that
# passed rather than a second run of it. The commit is compiled exactly once —
# `dotnet publish --no-build` reuses what `dotnet build` produced and what `dotnet test` ran
# against, so the app the browsers see is the app the unit tests passed on, not a rebuild of it.

on:
  # The event that reports these four checks in the ordinary course of things, and the merge ref is
  # the thing worth building: `actions/checkout` resolves a `pull_request` event to
  # `refs/pull/N/merge`, this branch already merged into main, where a push event would check out
  # the branch tip on its own. Nothing runs on main afterwards — merging deploys — so what goes
  # green here is the last word on the commit that reaches the volume. It covers a fork's pull
  # request too.
  pull_request:
  # The escape hatch, for a branch with no pull request yet and for the case where a pull request
  # somehow shows no checks at all. It reports the same four contexts, so it can unlock a merge on
  # its own — off the branch tip rather than the merge ref. See docs/deployment.md.
  workflow_dispatch:

# Keyed by ref, so pushing again to a pull request cancels that pull request's run and nothing
# else. A dispatched run is left to finish: it was asked for by hand.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # All four jobs here are required checks, and `main`'s ruleset names each of them by the `name:`
  # it declares — emoji included, since the context is matched as a whole string. Renaming one means
  # editing .github/rulesets/main-every-check-green.json in the same change *and* re-importing it
  # into the repository's settings, or the merge button waits forever on a check nothing reports.
  # See docs/deployment.md.
  build:
    name: 🔨 Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The SDK comes from global.json, not from a floating '10.0.x' — that resolved to a different
      # *feature band* than the one a Claude Code web container installs (10.0.302 against 10.0.110),
      # and an RZ2005 Razor error once failed there while this build stayed green. global.json sets
      # rollForward: disable, so a runner that happens to preinstall a newer 10.x cannot be picked
      # up instead of the version installed here.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Keyed on what decides the graph — the central package versions, the project files, and the
      # SDK pin — so a run that changes none of them restores from disk instead of from nuget.org.
      # `restore-keys` means a run that *does* change one still starts from the last good cache and
      # fetches only what moved.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      # The collector rides along with the run this gate already does — one test run, not a second
      # one for the number. coverage.runsettings decides which files it may count (the same file
      # scripts/coverage.sh passes), and the Coverage job below is what judges the report.
      - name: Test, with the coverage collector attached
        run: >-
          dotnet test --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage" --settings coverage.runsettings
          --results-directory artifacts/coverage

      # Handed to the Coverage job below, and kept for the week a reviewer might want to open the
      # Cobertura report itself rather than the summary that job writes.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage/
          retention-days: 7

      # The one compile in this pipeline ends here. `--no-build` publishes what the two steps above
      # already produced; without it this would be a second compile of the same commit.
      #
      # ReadyToRun off, which the Dockerfile leaves on: it forces a runtime-identifier-specific
      # publish, which `--no-build` cannot satisfy, and pre-compiling to native code buys a faster
      # first render that nothing downstream measures.
      - name: Publish the app the browser jobs will run
        run: >-
          dotnet publish src/FootballFormation.Web/FootballFormation.Web.csproj
          -c Release --no-build -p:PublishReadyToRun=false -o artifacts/app

      # 84MB of the 104MB published is SQLitePCLRaw's native library for every architecture it
      # supports, riscv64 and mips64 included. The runner is one of them, and this is uploaded once
      # and downloaded twice — so keep the one it will actually load. 104MB down to 23MB.
      - name: Drop the native libraries for other architectures
        run: find artifacts/app/runtimes -mindepth 1 -maxdepth 1 ! -name linux-x64 -exec rm -rf {} +

      # A day, because nothing reads this after the run that made it — unlike the reports, which
      # are uploaded for a person to open.
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: artifacts/app/
          retention-days: 1

  # Whether the code this branch changed is tested. Not the repository's overall percentage, which
  # a review cannot act on — Core sits above 95%, so a solution-wide 80% gate would pass with an
  # entirely untested new service in the diff. scripts/coverage.mjs takes the added and rewritten
  # lines, keeps the ones the instrumenter counted as coverable, and holds them to an 80% floor;
  # docs/testing.md has the reasoning. The result is written to this run's summary page, so the
  # number is read without opening a log or downloading the report.
  #
  # Blocking, like the two browser jobs below: under the floor, the merge button stays disabled. A
  # change that touches no coverable line — docs, CSS, a workflow — measures nothing and passes, so
  # requiring this cannot wedge a pull request that had no code in it. It needs no compiler, the
  # report having come out of the test run above, so it is node and a git history and it is over in
  # seconds.
  coverage:
    name: 📊 Coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, unlike every other job here: judging the change means diffing against
      # the merge base, and the single-commit checkout the others get has nothing to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage

      # The base branch rather than a hardcoded main, so a pull request onto a release branch is
      # judged on what it actually changed. workflow_dispatch has no pull request and falls back to
      # the repository's default branch.
      - name: Judge the lines this change touched
        run: node scripts/coverage.mjs
        env:
          COVERAGE_BASE: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

  # What the app does: the public/admin split, the dialogs, the match-day journey, both languages,
  # the phone layout. See docs/testing.md.
  #
  # Blocking. Merging is now the release, and nothing re-tests on main afterwards, so a browser
  # failure is dealt with here or not at all. The cost is that a flake holds the merge: re-run the
  # job from the Actions page, because the ruleset grants no bypass to anyone.
  playwright:
    name: 🎭 Playwright
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The runtime to start the published app with — this job never compiles anything. setup-dotnet
      # is what puts the pinned build on the runner, and it is a second or two when the version is
      # already in the image's cache.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Pinned rather than left to whatever the image ships: tests/ui/run.mjs uses
      # `import.meta.dirname`, which needs Node 20.11 or newer. 22 is a deliberate floor, not the
      # newest — the suite needs nothing above it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: app
          path: artifacts/app

      # No lockfile: tests/ui/package-lock.json is git-ignored, the same as scripts/'s — so the
      # cache is keyed on the manifest that decides what npm resolves, and ~/.npm is the download
      # cache rather than node_modules, which npm still has to link on every run.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-ui-${{ hashFiles('tests/ui/package.json') }}
          restore-keys: npm-${{ runner.os }}-ui-

      # The browser download, which is most of the install step below — about 10 seconds of it on a
      # hit. `playwright install` still runs: it is a no-op when the revision is already there, and
      # it is what fetches a new one when a patch release moves the revision without moving
      # package.json.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ui-${{ hashFiles('tests/ui/package.json') }}
          restore-keys: playwright-${{ runner.os }}-ui-

      - run: npm install --no-audit --no-fund
        working-directory: tests/ui

      # Only Chromium. The suite runs one browser, and --with-deps brings the system libraries the
      # runner image does not have.
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui

      # run.mjs makes the throwaway database, Playwright's webServer starts the published app
      # against it, and both are cleaned up when this exits. UI_TEST_APP_DLL is what points that
      # webServer at the artifact instead of compiling its own. CI=true is already set, which turns
      # on one retry — a test that only passes on that retry is reported as flaky, not quietly green.
      - run: npm test
        working-directory: tests/ui
        env:
          UI_TEST_APP_DLL: ${{ github.workspace }}/artifacts/app/FootballFormation.Web.dll

      # Traces and screenshots are written for failures only, so this uploads nothing on a green run.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          retention-days: 7

  # Whether it renders at all, and whether a thumb can hit it. This is the only thing holding the
  # Touch / PWA fixes in docs/known_issues.md in place — every one of them is CSS, and a MudBlazor
  # upgrade or one more global .mud-* rule undoes any of them silently. Blocking, for the same
  # reason as the job above.
  visual:
    name: 📸 Visual check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: app
          path: artifacts/app

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-scripts-${{ hashFiles('scripts/package.json') }}
          restore-keys: npm-${{ runner.os }}-scripts-

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-scripts-${{ hashFiles('scripts/package.json') }}
          restore-keys: playwright-${{ runner.os }}-scripts-

      - run: npm install --no-audit --no-fund
        working-directory: scripts

      - run: npx playwright install --with-deps chromium
        working-directory: scripts

      # The script owns its own throwaway database and exits non-zero on a browser error or a touch
      # target under its floor. VISUAL_APP_DLL hands it the published app, so it starts that rather
      # than building one. visual-check.mjs resolves Chromium itself when the web container's copy
      # is absent, which is the case here.
      - run: scripts/visual-check.sh
        env:
          VISUAL_APP_DLL: ${{ github.workspace }}/artifacts/app/FootballFormation.Web.dll

      # Uploaded on success too: the screenshots are the point of this job as much as the
      # measurements are, and they are worth a look on a pull request that changed a page.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-check
          path: artifacts/visual/
          retention-days: 7
