name: CI

on:
  # Every pull request, whatever it targets. Kept for pull requests from a fork, which the push
  # trigger below never sees.
  pull_request:
  # And every push to a branch, because GitHub starts no workflow run for an event it attributes to
  # an app token — so a pull request opened by one sits with no "Build and test" at all, and the
  # merge button stays disabled until somebody pushes again. A push always belongs to whoever
  # pushed. main is excluded: fly-deploy.yml calls this workflow there.
  #
  # The cost is that a pull request from this repository now builds twice, once per event. That is
  # about a minute of runner time and no risk — both runs test the same commit — and it buys a gate
  # that reports without being poked.
  push:
    branches-ignore: [main]
  # Called by fly-deploy.yml, so the gate in front of a deploy is literally the same build and
  # test a pull request ran, rather than a copy of it that can drift.
  workflow_call:
  workflow_dispatch:

# Keyed by ref, so a pull request's checks start straight away instead of queueing behind a
# deploy. A run on main is left to finish — its build is what a deploy is waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Nothing here can deploy: this workflow holds no deploy job and no Fly token. That is the point
  # of it being separate — a pull request cannot reach production by way of a misread condition.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The SDK comes from global.json, not from a floating '10.0.x' — that resolved to a different
      # *feature band* than the one a Claude Code web container installs (10.0.302 against 10.0.110),
      # and an RZ2005 Razor error once failed there while this build stayed green. global.json sets
      # rollForward: disable, so a runner that happens to preinstall a newer 10.x cannot be picked
      # up instead of the version installed here.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal
