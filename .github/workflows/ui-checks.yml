name: UI checks

# The two things that drive a browser, in one file that is separate from ci.yml — and that
# separation is the whole point of it.
#
# fly-deploy.yml calls ci.yml wholesale (`uses: ./.github/workflows/ci.yml`), so every job in that
# file is a gate in front of the production volume: adding either of these there would mean a
# browser can block a deploy. Neither is what `main`'s ruleset requires to merge, which names
# "Build and test", so both stay advisory until they have a track record on real runners.
#
# Promoting one later is a line in .github/rulesets/main-build-and-test.json, and nothing here.
#
# The app is built once, by the `app` job, and both browser jobs run *that* copy — they used to
# compile their own, which meant this file built the same commit twice and the Playwright job
# built it again from inside `dotnet run`. Everything downstream of `app` therefore needs the
# runtime, not the sources: it starts `dotnet FootballFormation.Web.dll` from the artifact.
#
# Triggered by the push rather than by the pull request, which is the opposite of ci.yml next door
# and deliberate in both places. These two are advisory and want the branch tip: they report on a
# branch before a pull request exists for it, which is when a page that renders blank is cheapest
# to find. ci.yml is the merge gate, so it wants the merge ref instead, and takes `pull_request`.
# The run still shows up on the pull request either way, because a check attaches to the commit
# rather than to the event.
#
# The trade is fork pull requests, which push here never sees — a push to a fork runs in the fork's
# own Actions, not here. `main` takes pull requests from this repository only, so today that costs
# nothing, and see docs/deployment.md before giving this a `pull_request` trigger: it would put a
# stranger's branch on our runner, which is a decision ci.yml has already made for itself.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The one compile in this file. Publishing rather than building, because the output has to survive
  # the trip to another runner: a published directory is self-describing and runs with `dotnet
  # <dll>`, where a bin/ tree would need the SDK and the sources it was built from to line up.
  app:
    name: Build app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The same SDK ci.yml installs and a web container installs — see global.json, and
      # docs/known_issues.md, "The SDK the pin cannot reach", before changing it.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # ReadyToRun off, which the Dockerfile leaves on: it forces a runtime-identifier-specific
      # publish, and pre-compiling to native code buys a faster first render that no test here
      # measures. Release regardless — TreatWarningsAsErrors only applies to that configuration,
      # and running a Debug build in the browser would be testing something the deploy never ships.
      - run: >-
          dotnet publish src/FootballFormation.Web/FootballFormation.Web.csproj
          -c Release -p:PublishReadyToRun=false -o artifacts/app

      # 84MB of the 104MB published is SQLitePCLRaw's native library for every architecture it
      # supports, riscv64 and mips64 included. The runner is one of them, and the artifact is
      # uploaded once and downloaded twice — so keep the one it will actually load.
      - name: Drop the native libraries for other architectures
        run: find artifacts/app/runtimes -mindepth 1 -maxdepth 1 ! -name linux-x64 -exec rm -rf {} +

      # A day, because nothing reads this after the run that made it — unlike the reports below,
      # which are uploaded for a person to open.
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: artifacts/app/
          retention-days: 1

  # What the app does: the public/admin split, the dialogs, the match-day journey, both languages,
  # the phone layout. See docs/testing.md.
  playwright:
    name: Playwright
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The runtime to start the published app with. setup-dotnet is what puts the pinned build on
      # the runner, and it is a second or two when the version is already in the image's cache.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Pinned rather than left to whatever the image ships: tests/ui/run.mjs uses
      # `import.meta.dirname`, which needs Node 20.11 or newer. 22 is a deliberate floor, not the
      # newest — the suite needs nothing above it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: app
          path: artifacts/app

      # No lockfile: tests/ui/package-lock.json is git-ignored, the same as scripts/'s — so the
      # cache is keyed on the manifest that decides what npm resolves, and ~/.npm is the download
      # cache rather than node_modules, which npm still has to link on every run.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-ui-${{ hashFiles('tests/ui/package.json') }}
          restore-keys: npm-${{ runner.os }}-ui-

      # The browser download, which is most of the install step below. `playwright install` still
      # runs on a hit — it is a no-op when the revision is already there, and it is what fetches a
      # new one when a patch release of Playwright moves the revision without moving package.json.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ui-${{ hashFiles('tests/ui/package.json') }}
          restore-keys: playwright-${{ runner.os }}-ui-

      - run: npm install --no-audit --no-fund
        working-directory: tests/ui

      # Only Chromium. The suite runs one browser, and --with-deps brings the system libraries the
      # runner image does not have.
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui

      # run.mjs makes the throwaway database, Playwright's webServer starts the app against it, and
      # both are cleaned up when this exits. UI_TEST_APP_DLL is what makes that webServer run the
      # published app from the `app` job instead of compiling one. CI=true is already set, which
      # turns on one retry — a test that only passes on that retry is reported as flaky rather than
      # quietly green.
      - run: npm test
        working-directory: tests/ui
        env:
          UI_TEST_APP_DLL: ${{ github.workspace }}/artifacts/app/FootballFormation.Web.dll

      # Traces and screenshots are written for failures only, so this uploads nothing on a green run.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          retention-days: 7

  # Whether it renders at all, and whether a thumb can hit it. This is the only thing holding the
  # Touch / PWA fixes in docs/known_issues.md in place — every one of them is CSS, and a MudBlazor
  # upgrade or one more global .mud-* rule undoes any of them silently.
  visual:
    name: Visual check
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: app
          path: artifacts/app

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-scripts-${{ hashFiles('scripts/package.json') }}
          restore-keys: npm-${{ runner.os }}-scripts-

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-scripts-${{ hashFiles('scripts/package.json') }}
          restore-keys: playwright-${{ runner.os }}-scripts-

      - run: npm install --no-audit --no-fund
        working-directory: scripts

      - run: npx playwright install --with-deps chromium
        working-directory: scripts

      # The script owns its own throwaway database and exits non-zero on a browser error or a touch
      # target under its floor. VISUAL_APP_DLL hands it the app the `app` job built, so the build it
      # would otherwise do itself does not happen a second time. visual-check.mjs resolves Chromium
      # itself when the web container's copy is absent, which is the case here.
      - run: scripts/visual-check.sh
        env:
          VISUAL_APP_DLL: ${{ github.workspace }}/artifacts/app/FootballFormation.Web.dll

      # Uploaded on success too: the screenshots are the point of this job as much as the
      # measurements are, and they are worth a look on a pull request that changed a page.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-check
          path: artifacts/visual/
          retention-days: 7
